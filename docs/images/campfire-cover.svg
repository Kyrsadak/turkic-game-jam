      <g fill="#698099"><rect x="30" y="28" width="3" height="3"/><rect x="133" y="51" width="3" height="3"/><rect x="205" y="27" width="3" height="3"/><rect x="303" y="48" width="3" height="3"/><rect x="402" y="24" width="3" height="3"/></g>
      <circle cx="362" cy="46" r="16" fill="#9dabc4"/><circle cx="369" cy="41" r="15" fill="#101827"/>
      <g fill="#1d2a3c"><path d="m23 150 30-62 30 62h-13l19 35H17l19-35z"/><path d="m91 134 21-48 21 48h-9l16 30H84l16-30z"/><path d="m312 141 24-53 24 53h-11l18 35h-62l18-35z"/><path d="m369 150 25-55 25 55h-11l17 34h-62l17-34z"/></g>
      <circle cx="222" cy="175" r="104" fill="url(#firelight)"/>
      <path d="M19 210H421" stroke="#667187"/>
      <g shape-rendering="crispEdges">
        <path d="M197 208h47v8h-47z" fill="#675044"/>
        <path d="M200 198h44v8h-44z" fill="#a56f44"/>
        <path d="M211 145h12v-18h8v31h9v18h8v17h-49v-17h6v-18h6z" fill="#d87536"/>
        <path d="M219 162h8v-14h6v25h6v20h-27v-18h7z" fill="#f4b75e"/>
        <path d="M221 177h8v-10h4v26h-16v-9h4z" fill="#ffe8a5"/>
