<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title description">
  <title id="title">Campfire — Keep the fire alive.</title>
  <desc id="description">An illustrated cover for the Campfire 2D game prototype: a warm campfire in a cold night forest.</desc>
  <defs>
    <radialGradient id="firelight"><stop stop-color="#e89a48" stop-opacity=".3"/><stop offset="1" stop-color="#e89a48" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="1278" height="438" rx="22" fill="#0b101b" stroke="#2c3342"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="62" y="61" fill="#a9afbf" font-size="11" letter-spacing="2.7">TURKIC GAME JAM / GODOT 2D</text>
    <path d="M62 84H1218" stroke="#2a3140"/>
    <text x="57" y="181" fill="#f4f2ec" font-size="79" font-weight="700" letter-spacing="-2">CAMPFIRE<tspan fill="#efad66">.</tspan></text>
    <text x="62" y="237" fill="#efad66" font-size="28">Keep the fire alive.</text>
    <text x="62" y="275" fill="#939db3" font-size="17">Gather wood. Build a settlement. Survive the night.</text>
    <g font-size="11" letter-spacing="1.3">
      <text x="63" y="344" fill="#b8bdca">GATHER</text><text x="144" y="344" fill="#596178">/</text>
      <text x="168" y="344" fill="#b8bdca">BUILD</text><text x="231" y="344" fill="#596178">/</text>
      <text x="254" y="344" fill="#b8bdca">SURVIVE</text>
    </g>
    <text x="63" y="400" fill="#68748d" font-size="10" letter-spacing="1.7">GDSCRIPT / SINGLE-PLAYER / GAME JAM PROTOTYPE</text>
    <g transform="translate(778 111)">
